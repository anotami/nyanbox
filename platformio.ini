; NyanBox - Display Test Firmware
; Platform: ESP32-WROOM-32
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    -DUSER_SETUP_LOADED=1
    ; --- Display driver: uncomment ONE ---
    -DIST7789_DRIVER=1
    ;-DILI9341_DRIVER=1
    ;-DILI9488_DRIVER=1
    ;-DST7735_DRIVER=1

    ; --- Resolution: adjust to your display ---
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    ; For 240x320: -DTFT_WIDTH=240 -DTFT_HEIGHT=320

    ; --- SPI Pins (ESP32 defaults) ---
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21

    ; --- SPI frequency ---
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
