; NyanBox - Display Test Firmware
; Platform: ESP32-WROOM-32
; Display:  RCmall ILI9341 2.8" 240x320 TFT LCD

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    ; Driver ILI9341 (2.8" 240x320)
    -DILI9341_DRIVER=1

    ; Resolución
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; Pines SPI ESP32-WROOM-32
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21

    ; Frecuencias SPI
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
